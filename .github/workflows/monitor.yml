name: Bot sync monitor

on:
  schedule:
    - cron: "3-59/10 * * * *"   # respaldo de Cloud Scheduler; fuera de la hora en punto, que GitHub satura
  workflow_dispatch:          # botón «Run workflow», Cloud Scheduler o «gh workflow run monitor.yml»

permissions:
  contents: write             # guardar estado.json en la rama «estado» (y el latido en main si no hay actividad)
  actions: read               # saber cuándo fue la ejecución anterior, para detectar huecos sin comprobaciones

concurrency:
  group: monitor              # una comprobación detrás de otra: nunca dos escribiendo el estado a la vez
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 12          # dos comprobaciones (hasta 2,5 min cada una) y la espera de CONFIRMAR (hasta 4 min)
    steps:
      # Fijada a un commit concreto (v7.0.1): un cambio en la acción no puede llegar a los secretos sin revisarlo.
      # Sin credenciales guardadas: el token solo lo usa scripts/workflow.sh, nunca monitor.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}  # lo último de la rama, no el commit del momento en que se lanzó
          persist-credentials: false

      - name: Traer el estado
        id: traer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/workflow.sh traer "$RUNNER_TEMP/estado.json"
          echo "anterior=$(bash scripts/workflow.sh anterior)" >> "$GITHUB_OUTPUT"

      - name: Comprobar el bot
        env:
          WHATSAPP_APP_ID: ${{ secrets.WHATSAPP_APP_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          SMTP_SERVIDOR: ${{ secrets.SMTP_SERVIDOR }}
          SMTP_PUERTO: ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          AVISOS_EMAIL: ${{ secrets.AVISOS_EMAIL }}
          NOMBRE_BOT: ${{ secrets.NOMBRE_BOT }}
          COMO_ARRANCAR: ${{ secrets.COMO_ARRANCAR }}
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          PAUSA_HASTA: ${{ vars.PAUSA_HASTA }}
          HORAS_SILENCIO: ${{ vars.HORAS_SILENCIO }}
          CONFIRMAR: ${{ vars.CONFIRMAR }}
          ULTIMA_EJECUCION: ${{ steps.traer.outputs.anterior }}
        run: python3 monitor.py --estado "$RUNNER_TEMP/estado.json"

      # Solo hay commit si el estado cambia. Se guarda aunque la comprobación termine en error (p. ej., el correo
      # no sale): así no se repiten los avisos que sí llegaron. Si no se pudo traer, no se toca nada.
      - name: Guardar el estado
        if: always() && steps.traer.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/workflow.sh guardar "$RUNNER_TEMP/estado.json"

      # Un commit en main si lleva 25 días sin ninguno: GitHub apaga el cron tras 60 días sin actividad.
      - name: Latido
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/workflow.sh latido

      # Vigila al vigilante: si healthchecks.io deja de recibir este aviso, te escribe él.
      - name: Avisar a healthchecks.io
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          RESULTADO: ${{ job.status }}
        run: bash scripts/workflow.sh vigilante
